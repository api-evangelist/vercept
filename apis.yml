description: Vercept is an AI startup building AI that works directly on your computer
  rather than in a distant cloud — software that understands your screen, workflows,
  and intent and can act on your behalf safely and transparently. Its product, Vy,
  is a personal computer AI assistant offered as a paid subscription. Vercept was
  founded by Kiana Ehsani, Luca Weihs, and Ross Girshick, backed by Point Nine, Fifty
  Years, AI2 Incubator, and Madrona, and was acquired by Anthropic in early 2026.
  Vercept does not currently publish a public developer API, SDK, or documentation
  surface; this profile captures its company identity and domain-security posture.
